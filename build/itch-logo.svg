<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <!--
    The logo itch.io lays over promotional modules in place of the project's title. Transparent,
    wider than it is tall, and it has to read on a light background as well as a dark one: the
    icon carries its own dark tile, and the wordmark is light with a dark edge drawn under it
    (paint-order), so the letters hold their shape either way.

    Rendered with: npx electron scripts/make-social.cjs build/itch-logo.svg build/itch-logo.png 1200 320 transparent
  -->
  <defs>
    <linearGradient id="markBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d5670"/>
      <stop offset="1" stop-color="#16303f"/>
    </linearGradient>
    <linearGradient id="markShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g transform="translate(150 160) scale(0.2) translate(-512 -512)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#markBg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#markShine)"/>
    <rect x="262" y="262" width="236" height="236" rx="48" fill="#a8d4ee"/>
    <rect x="526" y="262" width="236" height="236" rx="48" fill="#e6f0f7"/>
    <rect x="262" y="526" width="236" height="236" rx="48" fill="#e6f0f7"/>
    <rect x="526" y="526" width="236" height="236" rx="48" fill="#cdb8f0"/>
  </g>

  <text x="290" y="205" font-family="Figtree, Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="150" font-weight="700" fill="#f2f7fb" stroke="#0a141b" stroke-width="12"
        stroke-linejoin="round" paint-order="stroke fill">Tessera</text>
</svg>
