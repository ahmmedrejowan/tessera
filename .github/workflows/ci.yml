name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # No signing certificates in CI; macOS builds are signed ad hoc by scripts/adhoc-sign.cjs.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Backups and restoring are tested against the real Kopia and rclone rather than a stand-in,
      # because what they are for is somebody's only copy of their work. Without these installed
      # those tests skip, and the one feature nobody can afford a bug in goes unchecked.
      #
      # Both come from the projects' own releases rather than a package manager: Ubuntu's rclone is
      # too old for `rclone serve s3`, which the storage tests stand up a server with, and neither
      # is packaged the same way on all three systems.
      - name: Kopia and rclone
        shell: bash
        env:
          KOPIA: 0.23.1
          RCLONE: 1.75.1
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.tessera-tools"
          cd "$(mktemp -d)"
          case "${{ runner.os }}" in
            macOS)   kopia_file="kopia-$KOPIA-macOS-$([ "$(uname -m)" = arm64 ] && echo arm64 || echo x64).tar.gz"
                     rclone_file="rclone-v$RCLONE-osx-$([ "$(uname -m)" = arm64 ] && echo arm64 || echo amd64).zip" ;;
            Linux)   kopia_file="kopia-$KOPIA-linux-x64.tar.gz"
                     rclone_file="rclone-v$RCLONE-linux-amd64.zip" ;;
            Windows) kopia_file="kopia-$KOPIA-windows-x64.zip"
                     rclone_file="rclone-v$RCLONE-windows-amd64.zip" ;;
          esac

          curl -fsSL -o kopia.pkg "https://github.com/kopia/kopia/releases/download/v$KOPIA/$kopia_file"
          curl -fsSL -o rclone.zip "https://github.com/rclone/rclone/releases/download/v$RCLONE/$rclone_file"
          case "$kopia_file" in *.zip) unzip -q kopia.pkg ;; *) tar -xzf kopia.pkg ;; esac
          unzip -q rclone.zip
          find . -name 'kopia' -o -name 'kopia.exe' -o -name 'rclone' -o -name 'rclone.exe' | while read -r f; do
            cp "$f" "$HOME/.tessera-tools/"
          done
          chmod +x "$HOME/.tessera-tools/"* || true
          echo "$HOME/.tessera-tools" >> "$GITHUB_PATH"

      - name: They are there
        shell: bash
        run: |
          kopia --version
          rclone --version | head -1

      - run: npm ci
      - run: npm run typecheck
      # The whole suite on all three systems, and on Linux with coverage as well, where the
      # thresholds in vitest.config.ts are a floor: a change that quietly stops testing something
      # fails the build rather than going unnoticed.
      - name: Tests
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then npm test -- --coverage; else npm test; fi
      - run: npm run build
      - name: Package (unpacked, the same settings a release uses)
        run: npx electron-builder --config build/builder.cjs --dir --publish never

  # The app itself, driven the way a person drives it. Linux only: one run is enough to catch a
  # broken screen, and a headless display is cheap there.
  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: End to end
        run: xvfb-run --auto-servernum npm run test:e2e
