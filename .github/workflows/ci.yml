name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # No signing certificates in CI; macOS builds are signed ad hoc by scripts/adhoc-sign.cjs.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Backups and restoring are tested against the real Kopia and rclone rather than a stand-in,
      # because what they are for is somebody's only copy of their work. Without these installed
      # those tests skip, and the one feature nobody can afford a bug in goes unchecked.
      - name: Kopia and rclone
        shell: bash
        run: |
          set -e
          case "${{ runner.os }}" in
            macOS)
              brew install kopia rclone
              ;;
            Linux)
              sudo apt-get update
              sudo apt-get install -y rclone
              curl -fsSL "https://github.com/kopia/kopia/releases/download/v0.21.1/kopia-0.21.1-linux-x64.tar.gz" -o /tmp/kopia.tar.gz
              sudo tar -xzf /tmp/kopia.tar.gz --strip-components=1 -C /usr/local/bin kopia-0.21.1-linux-x64/kopia
              ;;
            Windows)
              choco install kopia rclone -y --no-progress
              ;;
          esac
          kopia --version
          rclone --version | head -1
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package (unpacked, the same settings a release uses)
        run: npx electron-builder --config build/builder.cjs --dir --publish never

  # The app itself, driven the way a person drives it. Linux only: one run is enough to catch a
  # broken screen, and a headless display is cheap there.
  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: End to end
        run: xvfb-run --auto-servernum npm run test:e2e
