name: Release builds

# Installers for every platform, from a version tag (v0.2.0) or by hand. A tag also drafts a
# release with the files and their checksums; you read it over and press publish.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  # Signed, verifiable proof that each file came from this commit through this workflow.
  id-token: write
  attestations: write

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # fpm needs rpmbuild for the Fedora package; the other targets need nothing extra.
      - name: rpm tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Where error reports go (a Sentry-compatible DSN). Without the secret the build can't send any.
          TESSERA_REPORTS_DSN: ${{ secrets.TESSERA_REPORTS_DSN }}
          # Where the app looks for a newer version: this repository's published releases. The
          # list rather than "latest", because GitHub's latest leaves previews out, and a preview
          # is what people are running until the first finished version.
          TESSERA_UPDATE_FEED: ${{ vars.TESSERA_UPDATE_FEED || format('https://api.github.com/repos/{0}/releases?per_page=10', github.repository) }}
      - run: npx electron-builder --config build/builder.cjs --publish never
        env:
          # Real signing when these secrets exist; otherwise the same unsigned / ad-hoc builds as before.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERT_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_PFX }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
      # Proof of where each file came from, checkable with: gh attestation verify <file> -R <repo>
      - name: Attest what was built
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm

      # A checksum beside each file, so anyone can tell a download is the one that was built here.
      - name: Checksums
        shell: bash
        run: |
          cd release
          shopt -s nullglob
          files=(*.dmg *.zip *.exe *.AppImage *.deb *.rpm)
          [ ${#files[@]} -gt 0 ] || { echo "nothing was built"; exit 1; }
          if command -v sha256sum > /dev/null; then sha256sum "${files[@]}" > "SHA256SUMS-${{ runner.os }}.txt";
          else shasum -a 256 "${files[@]}" > "SHA256SUMS-${{ runner.os }}.txt"; fi
          cat "SHA256SUMS-${{ runner.os }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: tessera-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/SHA256SUMS-*.txt
          if-no-files-found: error

  publish:
    name: Draft the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # What is new comes from CHANGELOG.md, so the release page and the app agree.
      - run: node scripts/release-notes.mjs ${{ github.ref_name }} > release-notes.md
      - run: cat release-notes.md
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
          merge-multiple: true
      - run: ls -la downloaded
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Tessera ${{ github.ref_name }}
          body_path: release-notes.md
          files: downloaded/*
