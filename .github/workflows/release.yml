name: Release builds

# Installers for every platform, from a version tag (v0.2.0) or by hand. A tag publishes the
# release, with the files and their checksums; anything below 1.0.0 goes out as a preview.
#
# By hand it builds and nothing else, so you can try an installer before anybody else sees it. The
# files come back as workflow artifacts. To publish from a hand-started run, choose the tag under
# "Use workflow from" and turn "Publish" on.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: Which computers to build for
        type: choice
        default: All three
        options:
          - All three
          - macOS only
          - Windows only
          - Linux only
      publish:
        description: Publish a release (only works when you chose a tag above)
        type: boolean
        default: false

permissions:
  contents: write
  # Signed, verifiable proof that each file came from this commit through this workflow.
  id-token: write
  attestations: write

jobs:
  # Which computers this run is for. A tag is always all three; a hand-started run is whatever was
  # chosen. Publishing part of a release would put out a version some people cannot download, so
  # that combination stops here rather than half way through.
  choose:
    name: What to build
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
    steps:
      - id: pick
        shell: bash
        run: |
          case "${{ inputs.platforms }}" in
            'macOS only')   os='["macos-latest"]' ;;
            'Windows only') os='["windows-latest"]' ;;
            'Linux only')   os='["ubuntu-latest"]' ;;
            *)              os='["macos-latest","windows-latest","ubuntu-latest"]' ;;
          esac
          echo "os=$os" >> "$GITHUB_OUTPUT"
          echo "Building for $os"
      - name: A release needs every platform
        if: inputs.publish && inputs.platforms != 'All three'
        run: |
          echo "Publishing was asked for with only ${{ inputs.platforms }} selected."
          echo "A release missing a platform is a release somebody cannot download."
          exit 1

  build:
    name: ${{ matrix.os }}
    needs: choose
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.choose.outputs.os) }}
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # fpm needs rpmbuild for the Fedora package; the other targets need nothing extra.
      - name: rpm tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Where error reports go (a Sentry-compatible DSN). Without the secret the build can't send any.
          TESSERA_REPORTS_DSN: ${{ secrets.TESSERA_REPORTS_DSN }}
          # Where the app looks for a newer version: this repository's published releases. The
          # list rather than "latest", because GitHub's latest leaves previews out, and a preview
          # is what people are running until the first finished version.
          TESSERA_UPDATE_FEED: ${{ vars.TESSERA_UPDATE_FEED || format('https://api.github.com/repos/{0}/releases?per_page=10', github.repository) }}
      - run: npx electron-builder --config build/builder.cjs --publish never
        env:
          # Real signing when these secrets exist; otherwise the same unsigned / ad-hoc builds as before.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERT_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_PFX }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
      # Proof of where each file came from, checkable with: gh attestation verify <file> -R <repo>
      - name: Attest what was built
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm

      # A checksum beside each file, so anyone can tell a download is the one that was built here.
      - name: Checksums
        shell: bash
        run: |
          cd release
          shopt -s nullglob
          files=(*.dmg *.zip *.exe *.AppImage *.deb *.rpm)
          [ ${#files[@]} -gt 0 ] || { echo "nothing was built"; exit 1; }
          if command -v sha256sum > /dev/null; then sha256sum "${files[@]}" > "SHA256SUMS-${{ runner.os }}.txt";
          else shasum -a 256 "${files[@]}" > "SHA256SUMS-${{ runner.os }}.txt"; fi
          cat "SHA256SUMS-${{ runner.os }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: tessera-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/SHA256SUMS-*.txt
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    # A tag publishes by itself. A hand-started run only publishes when it was asked to, and only
    # when what it was started from is a tag: there is no version and no release notes otherwise.
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # What is new comes from CHANGELOG.md, so the release page and the app agree.
      - run: node scripts/release-notes.mjs ${{ github.ref_name }} > release-notes.md
      - run: cat release-notes.md
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
          merge-multiple: true
      - run: ls -la downloaded
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          # Anything before 1.0.0, and anything with a suffix (v1.0.0-rc1), is a preview. GitHub
          # then keeps it out of "latest", which is why the update check reads the list instead.
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
          name: Tessera ${{ github.ref_name }}
          body_path: release-notes.md
          files: downloaded/*
