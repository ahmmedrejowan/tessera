name: Release builds

# Installers for every platform, and the release they go out in.
#
# Two ways to release, and they do the same thing:
#
#   By hand   Bump the version in package.json, write its section in CHANGELOG.md, push that to
#             main, then Run workflow with "Publish" on. The version is read out of package.json,
#             the tag is made for you, and the release goes out.
#   By tag    Push a tag like v1.0.0 yourself. Everything after that is the same.
#
# Run workflow with "Publish" off builds and nothing else, so you can try an installer before
# anybody else sees it: the files come back as workflow artifacts and no release is made.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: Which computers to build for
        type: choice
        default: All three
        options:
          - All three
          - macOS only
          - Windows only
          - Linux only
      publish:
        description: Publish a release, tagging this commit with the version in package.json
        type: boolean
        default: false

permissions:
  contents: write
  # Signed, verifiable proof that each file came from this commit through this workflow.
  id-token: write
  attestations: write

jobs:
  # What this run is: which computers, which version, and whether anybody else will see it.
  # Everything that can be wrong about a release is checked here, before ten minutes of building.
  choose:
    name: What to build
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
      tag: ${{ steps.what.outputs.tag }}
      publish: ${{ steps.what.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        shell: bash
        run: |
          case "${{ inputs.platforms }}" in
            'macOS only')   os='["macos-latest"]' ;;
            'Windows only') os='["windows-latest"]' ;;
            'Linux only')   os='["ubuntu-latest"]' ;;
            *)              os='["macos-latest","windows-latest","ubuntu-latest"]' ;;
          esac
          echo "os=$os" >> "$GITHUB_OUTPUT"
          echo "Building for $os"
      - id: what
        name: Which version, and is it going out
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = push ]; then
            # A tag was pushed: that tag is the release, and it publishes.
            tag='${{ github.ref_name }}'
            publish=true
          else
            # Started by hand: the version is the one in package.json, which is the same one the
            # app will report about itself, so the two can never disagree.
            tag="v$(jq -r .version package.json)"
            publish='${{ inputs.publish }}'
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Tag: $tag. Publishing: $publish."
      - name: A release needs every platform
        if: inputs.publish && inputs.platforms != 'All three'
        run: |
          echo "Publishing was asked for with only ${{ inputs.platforms }} selected."
          echo "A release missing a platform is a release somebody cannot download."
          exit 1
      - name: The changelog has to say what is new
        if: steps.what.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.what.outputs.tag }}"
          version="${version#v}"
          if ! grep -q "^## ${version}\b" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## ${version}' section."
            echo "The release page and the app's About screen both read it, so there is nothing to say yet."
            exit 1
          fi
          echo "Found the ${version} section."
      - name: That version has not gone out already
        if: steps.what.outputs.publish == 'true' && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.what.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null 2>&1; then
            echo "$tag is already tagged, so this version has been released."
            echo "Bump the version in package.json and add its section to CHANGELOG.md first."
            exit 1
          fi
          echo "$tag is free."

  build:
    name: ${{ matrix.os }}
    needs: choose
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.choose.outputs.os) }}
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # fpm needs rpmbuild for the Fedora package; the other targets need nothing extra.
      - name: rpm tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Where error reports go (a Sentry-compatible DSN). Without the secret the build can't send any.
          TESSERA_REPORTS_DSN: ${{ secrets.TESSERA_REPORTS_DSN }}
          # Where the app looks for a newer version: this repository's published releases. The
          # list rather than "latest", because GitHub's latest leaves previews out, and a preview
          # is what people are running until the first finished version.
          TESSERA_UPDATE_FEED: ${{ vars.TESSERA_UPDATE_FEED || format('https://api.github.com/repos/{0}/releases?per_page=10', github.repository) }}
      - run: npx electron-builder --config build/builder.cjs --publish never
        env:
          # Real signing when these secrets exist; otherwise the same unsigned / ad-hoc builds as before.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERT_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_PFX }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
      # Proof of where each file came from, checkable with: gh attestation verify <file> -R <repo>
      - name: Attest what was built
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm

      # A checksum beside each file, so anyone can tell a download is the one that was built here.
      - name: Checksums
        shell: bash
        run: |
          cd release
          shopt -s nullglob
          files=(*.dmg *.zip *.exe *.AppImage *.deb *.rpm)
          [ ${#files[@]} -gt 0 ] || { echo "nothing was built"; exit 1; }
          if command -v sha256sum > /dev/null; then sha256sum "${files[@]}" > "SHA256SUMS-${{ runner.os }}.txt";
          else shasum -a 256 "${files[@]}" > "SHA256SUMS-${{ runner.os }}.txt"; fi
          cat "SHA256SUMS-${{ runner.os }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: tessera-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/SHA256SUMS-*.txt
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [choose, build]
    if: needs.choose.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.choose.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      # Started by hand, the tag does not exist yet: it is made here, on the very commit that was
      # just built and tested, so the tag can never point at something that was never built.
      - name: Tag this commit
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git tag -a "$TAG" -m "Tessera $TAG"
          git push origin "$TAG"
      # What is new comes from CHANGELOG.md, so the release page and the app agree.
      - run: node scripts/release-notes.mjs "$TAG" > release-notes.md
      - run: cat release-notes.md
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
          merge-multiple: true
      - run: ls -la downloaded
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          tag_name: ${{ needs.choose.outputs.tag }}
          # Anything before 1.0.0, and anything with a suffix (v1.0.0-rc1), is a preview. GitHub
          # then keeps it out of "latest", which is why the update check reads the list instead.
          prerelease: ${{ startsWith(needs.choose.outputs.tag, 'v0.') || contains(needs.choose.outputs.tag, '-') }}
          name: Tessera ${{ needs.choose.outputs.tag }}
          body_path: release-notes.md
          files: downloaded/*
